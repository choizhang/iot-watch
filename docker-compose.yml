services:
  # 1. 实时状态缓存 Redis
  redis:
    image: redis:7.0-alpine
    container_name: iot-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes # 开启 AOF 实时持久化
    volumes:
      - redis_data:/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. 历史轨迹/健康时序库 InfluxDB
  influxdb:
    image: influxdb:2.7-alpine
    container_name: iot-influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    environment:
      # InfluxDB 2.x 初始化配置（脱敏及环境变量支持）
      DOCKER_INFLUXDB_INIT_MODE: "setup"
      DOCKER_INFLUXDB_INIT_USERNAME: "${INFLUXDB_USERNAME:-choizhang}"
      DOCKER_INFLUXDB_INIT_PASSWORD: "${INFLUXDB_PASSWORD:-c12345678}"
      DOCKER_INFLUXDB_INIT_ORG: "${INFLUXDB_ORG:-hkbn}"
      DOCKER_INFLUXDB_INIT_BUCKET: "${INFLUXDB_BUCKET:-iot}"
      DOCKER_INFLUXDB_INIT_RETENTION: "30d"
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "${INFLUXDB_TOKEN:--FUkRJFx_AEBDos6dnkaQlOUfCsgmXDOpbpqhvsaUJ7z-NgFykL94kzMI4QJz2GvgIeiIFCg98SBgBJLXqBAhA==}"
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. 关系型数据库 MySQL
  mysql:
    image: mysql:8.0
    container_name: iot-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_PASSWORD:-YourPassword123}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-hkbn_iot}"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD:-YourPassword123}"]
      interval: 10s
      timeout: 5s
      retries: 5

# 统一在底部声明所有本地数据卷（Volume）
volumes:
  redis_data:
  influxdb_data:
  influxdb_config:
  mysql_data:
